[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-ci-repair-agent"
version = "0.1.0"
description = "Bounded CI repair proposals with LangChain and LangGraph"
requires-python = ">=3.11"
dependencies = ["langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "langchain-openai>=1,<2", "langchain-core>=1,<2", "pydantic>=2,<3", "PyYAML>=6,<7", "python-dotenv>=1.2,<2", "azure-identity>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ci-repair = "ci_repair.cli:main"

[tool.setuptools.packages.find]
include = ["ci_repair*"]
