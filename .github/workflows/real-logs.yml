# Runs every synthetic fixture as a real CI job (expected to fail), then downloads those
# job logs through the read-only adapter and runs the agent on them with isolated
# validation. A second job repeats the scenarios in a network-less Docker sandbox.
name: Real CI logs
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture:
    name: fixture (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [S01, S02, S03, S04, S05, S06]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Materialize the synthetic repository
        run: python scripts/materialize_fixture.py ${{ matrix.scenario }} "$RUNNER_TEMP/fixture"
      - name: Run the fixture's own CI commands (expected to fail)
        id: fixture
        continue-on-error: true
        working-directory: ${{ runner.temp }}/fixture
        run: |
          python -m venv .venv
          . .venv/bin/activate
          bash -e .fixture-commands.sh
      - name: Check that the fixture really failed
        if: steps.fixture.outcome != 'failure'
        run: |
          echo "::error::Fixture ${{ matrix.scenario }} was expected to fail"
          exit 1

  agent:
    name: agent on real logs (venv isolation)
    needs: fixture
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # download the fixture job logs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: |
          python -m pip download --only-binary=:all: -d "$RUNNER_TEMP/wheelhouse" -r isolation/wheelhouse.txt
      - name: Download the fixture logs and run the agent on them
        env:
          GITHUB_TOKEN: ${{ github.token }}  # read by the log adapter only; the sandbox gets a clean environment
        run: >-
          python scripts/run_report.py --logs github --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
          --isolation venv --wheelhouse "$RUNNER_TEMP/wheelhouse" --output real-logs-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: real-logs-report
          path: real-logs-report/

  docker:
    name: scenarios in a network-less container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Pre-fetch wheels for the container's interpreter
        run: |
          mkdir -p "$RUNNER_TEMP/wheelhouse"
          docker run --rm -v "$RUNNER_TEMP/wheelhouse:/wheels" -v "$PWD/isolation:/req:ro" python:3.12-slim \
            python -m pip download --only-binary=:all: -d /wheels -r /req/wheelhouse.txt
      - name: Run all scenarios with --network none
        run: >-
          python scripts/run_report.py --logs synthetic --isolation docker
          --wheelhouse "$RUNNER_TEMP/wheelhouse" --output docker-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: docker-report
          path: docker-report/
