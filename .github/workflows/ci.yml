name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      # Wheels for the isolated-run tests, fetched once so the sandbox needs no index.
      - run: |
          python -m pip download --only-binary=:all: -d "$RUNNER_TEMP/wheelhouse" -r isolation/wheelhouse.txt
      - run: python -m pytest -q
        env:
          CI_REPAIR_WHEELHOUSE: ${{ runner.temp }}/wheelhouse
      - run: python scripts/generate_evidence.py --check
