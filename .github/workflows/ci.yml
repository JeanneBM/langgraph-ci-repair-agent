name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      # Wheels for the isolated-run tests, fetched once so the sandbox needs no index.
      - run: |
          python -m pip download --only-binary=:all: -d "$RUNNER_TEMP/wheelhouse" -r isolation/wheelhouse.txt
      - run: python -m pytest -q
        env:
          CI_REPAIR_WHEELHOUSE: ${{ runner.temp }}/wheelhouse
      - run: python scripts/generate_evidence.py --check
